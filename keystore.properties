# Signing key shared by the desktop build and CI, so updates install over one another.
# Both this file and the keystore it points at are committed on purpose: this is a
# personal side-load app, and a stable certificate is the only way a GitHub-built APK can
# replace the one already on the phone instead of being refused as a different app.
storeFile=keystore/signal-intelgo.jks
storePassword=signalintelgo
keyAlias=signal_intelgo
keyPassword=signalintelgo
