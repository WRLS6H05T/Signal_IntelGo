name: firmware

# Builds the two sensor images for a bare C3/C5 board. The app does not bundle or write them, so
# this workflow exists to produce them on a machine with no Arduino toolchain: download the
# artifacts and flash one from a PC with `esptool write-flash 0x0`.

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the esp32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install esptool
        run: pip install "esptool>=5,<6"

      - name: Compile both images
        run: bash firmware/build.sh

      - name: Show what was built
        run: ls -l firmware/out

      - uses: actions/upload-artifact@v4
        with:
          name: sensor-firmware
          path: |
            firmware/out/esp32c3.bin
            firmware/out/esp32c5.bin
            firmware/out/firmware.json
          if-no-files-found: error
