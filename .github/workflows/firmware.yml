name: firmware

# Builds the two sensor images for a bare C3/C5 board from the ESP-IDF project in
# firmware/SignalSensor. The app does not bundle or write them, so this workflow exists to produce
# them on a machine with no ESP-IDF toolchain: download the artifacts and flash one from a PC with
# `esptool write-flash 0x0`.

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same IDF the project is developed against: the band-mode API and the NimBLE host are
      # what the port is for, and building it with a different release than the one that compiles
      # here would hide a break behind a version.
      - name: Compile both images
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            espressif/idf:release-v6.1 \
            bash firmware/build.sh

      - name: Show what was built
        run: ls -l firmware/out

      - uses: actions/upload-artifact@v4
        with:
          name: sensor-firmware
          path: |
            firmware/out/esp32c3.bin
            firmware/out/esp32c5.bin
            firmware/out/firmware.json
          if-no-files-found: error
