name: Build APK

# Every push to main builds a signed debug APK and publishes it as its own release, so the
# phone can download it from GitHub and install it over the previous build without a cable,
# an SD card or a computer. The newest release is always the one marked latest.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  # Queue rather than cancel: a run killed between naming the APK and finishing the upload would
  # leave a release holding a half-written asset.
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The build number is the commit count, and a shallow clone would report 1 - a
          # versionCode below the installed one, which Android refuses as a downgrade.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu runners already carry the SDK with platform 34 and the build tools; the
      # setup-android action failed here, so the preinstalled one is used and its contents
      # are printed to make a missing platform obvious in the log.
      - name: Check the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Verify the signature carries all three schemes
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      # The asset name carries the build number. Publishing every build under one fixed name -
      # which is what this used to do - deletes and re-uploads that file on every push, and a
      # download overlapping a build then resumes against a different object: the phone shows the
      # last megabyte and hangs on a file it never finishes. A unique name cannot be swapped
      # underneath a transfer.
      - name: Name the APK
        id: apk
        run: |
          BUILD=$(git rev-list --count HEAD)
          NAME="Signal_IntelGo-1.1.$BUILD.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=1.1.$BUILD" >> "$GITHUB_OUTPUT"
          echo "code=$((BUILD + 1))" >> "$GITHUB_OUTPUT"
          ls -l "$NAME"

      # Actions zips whatever it is handed, so this copy is an archive, not something to tap on a
      # phone. The release asset below is the installable one.
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signal_IntelGo-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # Each build gets its own release and its own asset name, so nothing is written over a file
      # someone may be downloading. The releases page marks this one latest.
      - name: Publish this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Signal_IntelGo ${{ steps.apk.outputs.version }}
          body: |
            `${{ steps.apk.outputs.name }}` - version ${{ steps.apk.outputs.version }},
            versionCode ${{ steps.apk.outputs.code }}.

            Built from ${{ github.sha }} on branch ${{ github.ref_name }}. Download the APK
            below and open it on the phone: Android installs it over the running app, because it
            is signed with the same key as every earlier build.
          files: ${{ steps.apk.outputs.name }}
          make_latest: true
          # A duplicate name must fail loudly rather than be swapped under a downloader.
          overwrite_files: false
          fail_on_unmatched_files: true

      # Only the newest handful are kept: a release is a download, not an archive, and the commit
      # history already holds every build.
      - name: Prune old builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | grep '^build-' \
            | while read -r tag; do
                gh release delete "$tag" --yes --cleanup-tag
              done || true
