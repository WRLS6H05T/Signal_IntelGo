name: Build APK

# Every push to main builds a signed debug APK and publishes it as the "latest" release,
# so the phone can download it from GitHub and install it over the previous build without
# a cable, an SD card or a computer.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The build number is the commit count, and a shallow clone would report 1 - a
          # versionCode below the installed one, which Android refuses as a downgrade.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu runners already carry the SDK with platform 34 and the build tools; the
      # setup-android action failed here, so the preinstalled one is used and its contents
      # are printed to make a missing platform obvious in the log.
      - name: Check the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Verify the signature carries all three schemes
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Signal_IntelGo-debug.apk

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signal_IntelGo-debug
          path: Signal_IntelGo-debug.apk
          if-no-files-found: error

      # A release asset is a plain public download: no GitHub login on the phone, and the
      # URL below never changes, so a bookmark or a desktop shortcut keeps working.
      - name: Publish to the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Built automatically from ${{ github.sha }} on branch ${{ github.ref_name }}.

            Download `Signal_IntelGo-debug.apk` below and open it on the phone to update in
            place. It is signed with the same key as every earlier build, so Android offers
            the update rather than refusing it as a different app.
          files: Signal_IntelGo-debug.apk
          make_latest: true

  # The desktop host is a second download on the same release. It runs after the APK job so the
  # two do not race to create the "latest" release; the URL is as permanent as the APK's.
  desktop:
    runs-on: windows-latest
    needs: apk
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Desktop tests
        run: ./gradlew :desktop:test --console=plain

      # A jpackage image, not an installer: it needs no administrator rights and carries its own
      # Java runtime, so the download is a folder that runs rather than something to install.
      - name: Build the desktop image
        run: ./gradlew :desktop:createDistributable --console=plain

      - name: Check the image carries the app and its BLE bridge
        shell: pwsh
        run: |
          $image = "desktop/build/compose/binaries/main/app/Signal_IntelGo"
          Get-ChildItem $image | Select-Object Name
          if (-not (Test-Path "$image/Signal_IntelGo.exe")) { throw "no launcher in the image" }

      - name: Zip the image
        shell: pwsh
        run: |
          Compress-Archive -Path "desktop/build/compose/binaries/main/app/Signal_IntelGo" `
            -DestinationPath "Signal_IntelGo-desktop.zip" -CompressionLevel Optimal
          "{0:N1} MB" -f ((Get-Item "Signal_IntelGo-desktop.zip").Length / 1MB)

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signal_IntelGo-desktop
          path: Signal_IntelGo-desktop.zip
          if-no-files-found: error

      - name: Publish to the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: Signal_IntelGo-desktop.zip
